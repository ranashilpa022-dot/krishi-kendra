<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <style>

    header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;

  background: linear-gradient(90deg, green, darkgreen);
  color: white;
  padding: 15px;
  text-align: center;
  box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
  
  background: green;
  color: white;
  padding: 15px;
  text-align: center;
}

body{
  scroll-behavior: smooth;
}
nav{
  display: flex;
  justify-content: center;
  gap: 40px;
  padding: 15px;
}

nav a {
  margin: 0 15px;
  color: white;
  text-decoration: none;
  font-weight: bold;
  font-size: 20px;
  transition: color 0.3s;
}

nav a:hover {
  color: yellow;
}


    body {
      font-family: Arial, sans-serif;
      background: #f2f7f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .contact-container {
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      width: 400px;
    }

    .contact-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: green;
    }

    .contact-form {
      display: flex;
      flex-direction: column;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      border-color: green;
      box-shadow: 0 0 5px rgba(0,128,0,0.3);
    }

    .contact-form textarea {
      resize: none;
      height: 120px;
    }

    .contact-form button {
      margin-top: 10px;
      background: green;
      color: white;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .contact-form button:hover {
      background: darkgreen;
    }

  </style>
</head>
<body>

  <header>
    <h1>🌾Shubham Krishi Kendra</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="services.html">Services</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>


  <div class="contact-container">
    <h2>Contact Us</h2>
    <form id="contactForm" class="contact-form">
      <input type="text" id="name" placeholder="Enter Name" required>
      <input type="email" id="email" placeholder="Enter Email" required>
      <input type="text" id="phone" placeholder="Enter Phone" required>
      <textarea id="message" placeholder="Enter Message" required></textarea>
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    document.getElementById("contactForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        message: document.getElementById("message").value
      };

      let response = await fetch("http://127.0.0.1:5000/contact", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(data)
      });

      let result = await response.json();
      alert(result.message);
    });
  </script>
</body>
</html>
